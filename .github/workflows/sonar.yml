name: SonarCloud Analysis

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Tests and Generate Coverage
        run: npm run test:coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test  # Este trabajo depende de que 'test' finalice con éxito
    permissions:
      contents: read
      checks: write
      statuses: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud necesita el historial completo para información de autoría

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Esperar Quality Gate de SonarCloud
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Leer la URL del dashboard generada por el scanner
          DASHBOARD_URL=$(grep '^dashboardUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)

          echo "⏳ Esperando que SonarCloud publique el Quality Gate en GitHub..."
          echo "🔗 Dashboard: ${DASHBOARD_URL}"

          for i in $(seq 1 36); do
            sleep 10
            echo "  Verificando intento $i/36..."

            API_URL="https://api.github.com/repos/${REPO}/commits/${COMMIT_SHA}/check-runs"

            RESULT=$(curl -sf \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API_URL}" | \
              jq -r '
                [.check_runs[] | select(.name | ascii_downcase | contains("sonar"))] |
                if length == 0 then "pending"
                else
                  .[0] |
                  if .status != "completed" then "pending"
                  elif .conclusion == "success" then "success"
                  else "failure"
                  end
                end
              ')

            echo "  Estado Quality Gate: ${RESULT}"

            if [[ "${RESULT}" == "success" ]]; then
              echo "✅ Quality Gate aprobado"
              echo "🔗 Ver detalles: ${DASHBOARD_URL}"
              exit 0
            elif [[ "${RESULT}" == "failure" ]]; then
              echo "❌ Quality Gate falló"
              echo "🔗 Ver detalles en SonarCloud: ${DASHBOARD_URL}"
              exit 1
            fi
          done

          echo "⚠️ Timeout: SonarCloud no publicó el resultado en 6 minutos"
          echo "🔗 Revisa manualmente: ${DASHBOARD_URL}"
          exit 1
