name: SonarCloud Analysis

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Tests and Generate Coverage
        run: npm run test:coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test  # Este trabajo depende de que 'test' finalice con éxito
    permissions:
      contents: read
      checks: write
      statuses: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud necesita el historial completo para información de autoría

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Esperar Quality Gate de SonarCloud
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          echo "⏳ Esperando que SonarCloud publique el Quality Gate en GitHub..."

          for i in $(seq 1 36); do
            sleep 10
            echo "  Verificando intento $i/36..."

            RESULT=$(curl -sf \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$COMMIT_SHA/check-runs" | \
              python3 -c "
import sys, json
data = json.load(sys.stdin)
runs = data.get('check_runs', [])
sonar = [r for r in runs if 'sonar' in r.get('name', '').lower() or 'sonar' in str(r.get('app', {})).lower()]
if not sonar:
    print('pending')
else:
    run = sonar[0]
    status = run.get('status', 'queued')
    conclusion = run.get('conclusion') or ''
    if status != 'completed':
        print('pending')
    elif conclusion == 'success':
        print('success')
    else:
        print('failure')
")

            echo "  Estado Quality Gate: $RESULT"

            if [[ "$RESULT" == "success" ]]; then
              echo "✅ Quality Gate aprobado"
              exit 0
            elif [[ "$RESULT" == "failure" ]]; then
              echo "❌ Quality Gate falló — revisa SonarCloud para más detalles"
              exit 1
            fi
          done

          echo "⚠️ Timeout: SonarCloud no publicó el resultado en 6 minutos"
          exit 1

